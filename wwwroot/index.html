<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
	<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-indigo.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="/css/common.css">
	<script src="/js/api.js"></script>
	<script src="/js/html.js"></script>
	<script src="/js/categories.js"></script>
	<script src="/js/table.js"></script>
	<script src="/js/todos.js"></script>
	<script src="/js/appstore.js"></script>
	<script src="/js/dragndrop.js"></script>
	<script src="/js/modal.js"></script>
</head>
<body class="w3-theme-d5">
	<div id="error" class="w3-panel w3-red w3-hide w3-animate-top">
		<i class="fa fa-close w3-right w3-padding w3-btn" onclick='html.hideError();'></i>
		<p id="error-content" class="w3-padding"></p>
	</div>
	<div class="w3-flex" style="width:100%;">
		<div style="flex-grow:1;"><h3 class="w3-margin-left">Tas<span style="color:yellow;">Q</span>ana</h3></div>
		<div id="btn-admin" class="w3-hide w3-padding"><a href="/admin">Admin</a></div>
		<div class="w3-padding">Hi, <span id="user-name"></span></div>
	</div>
	<div class="w3-row w3-margin" style="gap: 16px; grid-template-columns: repeat(4, 1fr); ">
		<div id="categories-block" class="w3-third w3-card-4 w3-padding w3-round-xlarge">
			<div class="w3-flex">
				<h3 class="z-flex-grow">
					Categories
					<i id="btn-cat-add" class="fa fa-plus-circle w3-right w3-btn"></i>
				</h3>
			</div>
			<div id="categories-list" class=""></div>
			<hr />
			<div id="category-priority" class="category-title w3-btn w3-block w3-left-align">
				<i class="fa fa-exclamation-triangle w3-text-red"></i> Priority
			</div>
			<div id="category-unsorted" class="category-title w3-btn w3-block w3-left-align">
				<i class="fa fa-telegram w3-text-blue"></i> Unsorted
			</div>
			<div id="category-started" class="category-title w3-btn w3-block w3-left-align">
                <i class="fa fa-toggle-right w3-text-yellow"></i> Started
			</div>
			<div id="category-completed" class="category-title w3-btn w3-block w3-left-align">
                <i class="fa fa-check-square w3-text-green"></i> Completed
			</div>
			
			
		</div>
		<div id="block-todos" class="w3-twothird w3-card-4 w3-padding w3-round-xlarge">
			<h3 class="title">
				<span id="todos-title"></span>
				<i id="btn-todo-add" class="fa fa-plus-circle w3-right w3-btn"></i>
			</h3>
			<div id="todos-list"></div>

		</div>
	</div>
	<div id="form-cat-create" class="w3-modal">
		<div class="w3-modal-content w3-card-4 w3-animate-zoom w3-theme-d4 w3-round-xlarge">
			<div class="w3-container">
				<h2>Create category</h2>
				<label>Enter category name</label>
				<input class="value-title w3-input" type="text" />
				<div class="w3-flex w3-margin">
					<button class="btn-create w3-btn w3-blue">Save</button>
					<button class="btn-cancel w3-btn">Cancel</button>
				</div>
			</div>
		</div>
	</div>
	<div id="form-cat-edit" class="w3-modal">
		<div class="w3-modal-content w3-card-4 w3-animate-zoom w3-theme-d4 w3-round-xlarge">
			<div class="w3-container">
				<h2>Category</h2>
				<label>Enter category name</label>
				<input class="value-title w3-input" type="text" />
				<div class="w3-flex w3-margin">
					<button class="btn-save w3-btn w3-blue">Save</button>
					<button class="btn-cancel w3-btn">Cancel</button>
				</div>
			</div>
		</div>
	</div>
	<div id="form-cat-delete" class="w3-modal">
		<div class="w3-modal-content w3-card-4 w3-animate-zoom w3-theme-d4 w3-round-xlarge">
			<div class="w3-container">
				<h2>Delete category?</h2>
				<div class="w3-flex w3-margin">
					<button class="btn-delete w3-btn w3-red">Delete</button>
					<button class="btn-cancel w3-btn">Cancel</button>
				</div>
			</div>
		</div>
	</div>

	<div id="form-todo-edit" class="w3-modal">
		<div class="w3-modal-content w3-card-4 w3-animate-zoom w3-theme-d4 w3-round-xlarge">
			<div class="w3-container">
				<div class="w3-flex" style="align-items:center;">
					<h2 class="w3-block">Task</h2>
					<div class="btn-cancel w3-btn fa fa-close"></div>
				</div>
				<label>Name</label>
				<input class="value-title w3-input" type="text" />
				<label>Description</label>
				<textarea class="value-description w3-input" rows="4" style="resize: vertical;"></textarea>
                <div class="w3-flex" style="align-items:center;">
                    <div>Priority:</div>
                    <div class="btn-priority-0 fa fa-star w3-large w3-btn"></div>
                    <div class="btn-priority-1 fa fa-star w3-large w3-btn"></div>
                    <div class="btn-priority-2 fa fa-star w3-large w3-btn"></div>
                    <div class="btn-priority-3 fa fa-star w3-large w3-btn"></div>
                    <div class="btn-priority-4 fa fa-star w3-large w3-btn"></div>
                </div>
				<table id="table-todo-checkitems" width="100%"></table>
				<div class="btn-checklist-add w3-btn fa fa-plus-circle"></div>
				<div class="w3-flex w3-margin">
					<button class="btn-create w3-btn w3-blue">Create</button>
					<button class="btn-save w3-btn w3-blue">Save</button>
					<button class="btn-start w3-btn w3-yellow">Start</button>
					<button class="btn-complete w3-btn w3-green">Complete</button>
                    <button class="btn-delete w3-btn w3-red">Delete</button>
					<button class="btn-cancel w3-btn">Cancel</button>
				</div>
			</div>
		</div>
	</div>

	<div id="form-check-edit" class="w3-modal">
		<div class="w3-modal-content w3-card-4 w3-animate-zoom w3-theme-d4 w3-round-xlarge">
			<div class="w3-container">
				<h2>Check item</h2>
				<label>Enter title</label>
				<input class="value-title w3-input" type="text" />
				<div class="w3-flex w3-margin">
					<button class="btn-create w3-btn w3-blue">Create</button>
					<button class="btn-save w3-btn w3-blue">Save</button>
					<button class="btn-cancel w3-btn">Cancel</button>
					<button class="btn-delete w3-btn w3-red">Delete</button>
				</div>
			</div>
		</div>
	</div>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const api = new Api();
			const store = new AppStore(api);
			const categoryCreate = new CategoryCreateModalDialog(store, "form-cat-create");
			const categoryEdit = new CategoryEditModalDialog(store, "form-cat-edit");
			const categoryDelete = new CategoryDeleteModalDialog(store, "form-cat-delete");
			const todoEdit = new TodoEditModalDialog(store, "form-todo-edit");
            const checkEdit = new CheckEditModalDialog(store, "form-check-edit");
			const dragndrop = new DragNDrop(store);
			store.update();
			store.user.autoUpdate();

			document.addEventListener('click', function (event) {
				subsribeTo(event, ".category-click", node => {
					const id = node.closest(".category-node").dataset.id;
					store.categories.select({categoryId:id});
				});
				subsribeTo(event, ".check-mark", node => { store.todos.checkItemToggle(node.dataset.id); });
                subsribeTo(event, "[data-modal]", node => { store.startEdit(node.dataset); });
			});

			document.getElementById("category-unsorted").addEventListener("click", function () {
				store.categories.select({});
			});

            document.getElementById("category-priority").addEventListener("click", function () {
				store.categories.select({priority:1});
			});

            document.getElementById("category-started").addEventListener("click", function () {
                store.categories.select({ state: 1 });
            });

            document.getElementById("category-completed").addEventListener("click", function () {
                store.categories.select({ state: 2 });
            });

			document.getElementById("btn-cat-add").addEventListener("click", function () {
				store.startEdit({ modal: "form-cat-create", id: null });
			});

			document.getElementById("btn-todo-add").addEventListener("click", function () {
				store.startEdit({ modal: "form-todo-edit", categoryid: store.todos.filter?.category?.id, iscreate:true });
			});

			document.addEventListener("dragstart", function (event) {
				dragndrop.onStart(event.target);
			});

			document.addEventListener("dragover", function (event) {
				if (dragndrop.onEnter(event.target))
					event.preventDefault();
			});

			document.addEventListener("dragleave", function (event) {
				dragndrop.onLeave(event.target);
			});

			document.addEventListener("dragend", function (event) {
				dragndrop.onEnd(event.target);
			});

			if (store.user.is_admin)
				document.getElementById("btn-admin").classList.remove("w3-hide");
			document.getElementById("user-name").innerText = store.user.name;
		});



		function subsribeTo(event, filter, onEvent) {
			const node = event.target.closest(filter);
			if (node == null) return;
			onEvent(event.target);
		}

		document.addEventListener('click', function (event) {
			html.processDropDown(event);
			html.processAccordion(event);
		});




	</script>
</body>
</html>
